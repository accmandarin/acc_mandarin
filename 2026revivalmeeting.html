<!-- 獲取主選單(header.html)檔案的內容 -->
<script>
  // 獲取外部檔案的內容
  fetch('header.html')
    .then(response => {
      // 確保回應成功
      if (!response.ok) {
        throw new Error('無法載入檔案');
      }
      // 將回應解析為純文字
      return response.text();
    })
    .then(htmlText => {
      // 找到容器元素並將獲取的 HTML 文字設定為其內容
      document.getElementById('content-container').innerHTML = htmlText;
    })
    .catch(error => {
      console.error('載入內容時出錯:', error);
      document.getElementById('content-container').innerHTML = '<p>載入內容失敗。</p>';
    });
</script>


<script>
  // 設定 header 高度
  function updateHeaderHeight() {
    const header = document.querySelector('header'); // Use querySelector for header
    if (header) {
      document.documentElement.style.setProperty('--header-height', header.offsetHeight + 'px');
    }
  }
  window.addEventListener('load', updateHeaderHeight);
  window.addEventListener('resize', updateHeaderHeight);

  // 漢堡選單切換
  function toggleMenu() { // Define the function for onclick
    const navMenu = document.getElementById('navMenu');
    if (navMenu) {
      navMenu.classList.toggle('active');
    }
  }

  // 下拉選單在手機模式下的開合邏輯
  document.querySelectorAll('nav ul li a').forEach(item => {
    item.addEventListener('click', function(event) {
      if (window.innerWidth <= 768) { // Only apply on mobile
        const parentLi = this.parentElement;
        if (parentLi.querySelector('ul')) { // If it has a submenu
          event.preventDefault(); // Prevent default link action
          parentLi.classList.toggle('active'); // Toggle 'active' for submenu display
        }
      }
    });
  });

  // 浮動公告漸入漸出
  const floatingBox = document.getElementById('floatingBox'); // Corrected variable name
  if (floatingBox) { // Check if the element exists
    setTimeout(() => { floatingBox.classList.add('show'); }, 500);
    setTimeout(() => { floatingBox.classList.remove('show'); }, 8000); // Remove 'show' to hide it
  }

  // 卡片漸入效果 (NEW)
  const cards = document.querySelectorAll('.card');
  cards.forEach((card, index) => {
    // Stagger the animation slightly for a nicer effect
    setTimeout(() => {
      card.classList.add('show');
    }, 100 * (index + 1)); // 100ms delay per card
  });

</script>
